<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header>
        <div class="header-info">
            <img src="./img/Capa_1.png" alt="logo-fotogram">
        </div>
    </header>

    <main>
        <h1>Mein Fotoalbum</h1>
        <div id="image-container" class="picture">
            
        </div>
    </main>
    <dialog id="open-dialog" class="dialog">
        <img id="dialog-img">
        <button id="close-button" class="close">X</button>
        <div class="nav-button" >
            <button class="nav back">&#x25C0;</button>
            <button class="nav next">&#x25B6;</button>
        </div>
    </dialog>
    <footer>
        <div class="nav-footer" >
            <p>© 2026 Developer Akademie GmbH</p>
        </div>
    </footer>
    <script src="./script.js"></script>
</body>

</html>
